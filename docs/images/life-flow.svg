<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 920" role="img" aria-labelledby="title desc"><title id="title">从一个问题，到下一次继续</title><desc id="desc">ZANE 人生经营工作台 · 先得到帮助，再按需要积累</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans SC',sans-serif}</style><rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/><text x="40" y="52" fill="#f8fafc" font-size="26" font-weight="700">从一个问题，到下一次继续</text><text x="40" y="83" fill="#94a3b8" font-size="15">ZANE 人生经营工作台 · 先得到帮助，再按需要积累</text><path d="M340 202V254" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 334V382" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 514V574" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 654V714" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 448H560" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M170 754H92V294H170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="357" y="549" fill="#fbbf24" font-size="14">需要</text><text x="480" y="435" fill="#94a3b8" font-size="14">不需要</text><text x="48" y="550" fill="#a78bfa" font-size="15" transform="rotate(-90 48 550)">新事实改变旧建议</text><rect x="170" y="122" width="340" height="80" rx="12" fill="#0f172a"/><rect x="170" y="122" width="340" height="80" rx="12" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-width="1.5"/><text x="340.0" y="155" fill="#f8fafc" font-size="19" font-weight="600" text-anchor="middle">说出眼前的事</text><text x="340.0" y="181" fill="#94a3b8" font-size="14" text-anchor="middle">问题、材料、选择，或一句说不清的困惑</text><rect x="170" y="254" width="340" height="80" rx="12" fill="#0f172a"/><rect x="170" y="254" width="340" height="80" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.5"/><text x="340.0" y="287" fill="#f8fafc" font-size="19" font-weight="600" text-anchor="middle">先拿到当下可用的帮助</text><text x="340.0" y="313" fill="#94a3b8" font-size="14" text-anchor="middle">一个判断、一份成果，或已授权的动作</text><polygon points="340,382 450,448 340,514 230,448" fill="#302919" stroke="#fbbf24" stroke-width="1.5"/><text x="340" y="445" text-anchor="middle" fill="#f8fafc" font-size="18">需要下次</text><text x="340" y="470" text-anchor="middle" fill="#f8fafc" font-size="18">继续吗？</text><rect x="560" y="408" width="280" height="80" rx="12" fill="#0f172a"/><rect x="560" y="408" width="280" height="80" rx="12" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-width="1.5"/><text x="700.0" y="441" fill="#f8fafc" font-size="19" font-weight="600" text-anchor="middle">这次帮助就已足够</text><text x="700.0" y="467" fill="#94a3b8" font-size="14" text-anchor="middle">简单问题无需建台</text><rect x="170" y="574" width="340" height="80" rx="12" fill="#0f172a"/><rect x="170" y="574" width="340" height="80" rx="12" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.5"/><text x="340.0" y="607" fill="#f8fafc" font-size="19" font-weight="600" text-anchor="middle">保存必要背景与成果</text><text x="340.0" y="633" fill="#94a3b8" font-size="14" text-anchor="middle">沿用你的文件夹，只留下下次有用的内容</text><rect x="170" y="714" width="340" height="80" rx="12" fill="#0f172a"/><rect x="170" y="714" width="340" height="80" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.5"/><text x="340.0" y="747" fill="#f8fafc" font-size="19" font-weight="600" text-anchor="middle">带着进展回来</text><text x="340.0" y="773" fill="#94a3b8" font-size="14" text-anchor="middle">接住已做的事，按现实变化继续调整</text><text x="40" y="853" fill="#cbd5e1" font-size="16">方向由你决定；方法在反复有用时沉淀，负担变重时做减法。</text><text x="40" y="881" fill="#94a3b8" font-size="13">保存与操作依赖所选 AI 软件的实际能力。图示为使用方法，不是效果承诺。</text></svg>