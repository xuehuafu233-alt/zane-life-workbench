<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">一个主入口，四个按需组件</title><desc id="desc">日常直接说问题；不需要先学会选择 Skill</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans SC',sans-serif}</style><rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/><text x="40" y="52" fill="#f8fafc" font-size="26" font-weight="700">一个主入口，四个按需组件</text><text x="40" y="83" fill="#94a3b8" font-size="15">日常直接说问题；不需要先学会选择 Skill</text><path d="M500 216V270H270V312" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 270H730V312" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 270V438H270V476" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 438H730V476" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="290" y="132" width="420" height="84" rx="12" fill="#0f172a"/><rect x="290" y="132" width="420" height="84" rx="12" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-width="1.5"/><text x="500.0" y="165" fill="#f8fafc" font-size="19" font-weight="600" text-anchor="middle">人生总控</text><text x="500.0" y="191" fill="#94a3b8" font-size="14" text-anchor="middle">理解当前问题，继续完成可用结果</text><rect x="60" y="312" width="420" height="84" rx="12" fill="#0f172a"/><rect x="60" y="312" width="420" height="84" rx="12" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.5"/><text x="270.0" y="345" fill="#f8fafc" font-size="19" font-weight="600" text-anchor="middle">搭建与维护</text><text x="270.0" y="371" fill="#94a3b8" font-size="14" text-anchor="middle">需要保存、接续或适配已有资料时</text><rect x="520" y="312" width="420" height="84" rx="12" fill="#0f172a"/><rect x="520" y="312" width="420" height="84" rx="12" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-width="1.5"/><text x="730.0" y="345" fill="#f8fafc" font-size="19" font-weight="600" text-anchor="middle">问题意图转译</text><text x="730.0" y="371" fill="#94a3b8" font-size="14" text-anchor="middle">问题模糊或多个意图混在一起时</text><rect x="60" y="476" width="420" height="84" rx="12" fill="#0f172a"/><rect x="60" y="476" width="420" height="84" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-width="1.5"/><text x="270.0" y="509" fill="#f8fafc" font-size="19" font-weight="600" text-anchor="middle">AI 伙伴设定</text><text x="270.0" y="535" fill="#94a3b8" font-size="14" text-anchor="middle">你想定义长期伙伴的工作方式时</text><rect x="520" y="476" width="420" height="84" rx="12" fill="#0f172a"/><rect x="520" y="476" width="420" height="84" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.5"/><text x="730.0" y="509" fill="#f8fafc" font-size="19" font-weight="600" text-anchor="middle">自我认识</text><text x="730.0" y="535" fill="#94a3b8" font-size="14" text-anchor="middle">你想深入探索价值、动机与反复选择时</text><text x="40" y="610" fill="#94a3b8" font-size="15">原三个方法继续保留，新增人生总控与搭建维护，共五个组件。</text></svg>